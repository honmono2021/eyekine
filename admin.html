<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeKine 블로그 관리자</title>
    
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 20px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        #editor {
            min-height: 400px;
            background: white;
            border-radius: 8px;
        }
        .ql-container {
            font-size: 16px;
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
        }
        .ql-editor {
            min-height: 400px;
            padding: 20px;
            line-height: 1.8;
        }
        .ql-editor img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }
        .ql-toolbar {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-bottom: none;
        }
        .ql-container {
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            border: 2px solid #e0e0e0;
            border-top: none;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .editor-screen {
            display: none;
        }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .post-list {
            margin-top: 20px;
        }
        .post-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-item .info {
            flex: 1;
        }
        .post-item .title {
            color: #2c3e50;
            font-weight: 600;
        }
        .post-item .date {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .post-item .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .post-item .btn-delete:hover {
            background: #c0392b;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .modal-content p {
            margin-bottom: 25px;
            color: #7f8c8d;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-confirm {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-cancel {
            background: #95a5a6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .editor-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #1976d2;
        }
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            h1 {
                font-size: 1.5em;
            }
            .ql-editor {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 로그인 화면 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>🔐 EyeKine 관리자</h1>
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            <label for="githubToken">GitHub 토큰</label>
            <input type="password" id="githubToken" placeholder="ghp_... 또는 github_pat_...">
            <button class="btn" onclick="login()">로그인</button>
            <div class="status-message" id="loginMessage"></div>
        </div>
    </div>
    <!-- 에디터 화면 -->
    <div class="editor-screen" id="editorScreen">
        <div class="container">
            <div class="card">
                <h1>✍️ 새 포스트 작성</h1>
                <p class="subtitle">워드처럼 자유롭게 편집하세요</p>
                <label for="title">제목</label>
                <input type="text" id="title" placeholder="포스트 제목을 입력하세요">
                <label>내용</label>
                <div class="editor-info">
                    <strong>💡 사용 방법:</strong> 툴바에서 이미지 버튼(🖼️)을 클릭하여 원하는 위치에 이미지를 삽입하세요.
                </div>
                
                <!-- Quill Editor -->
                <div id="editor"></div>
                <button class="btn" id="publishBtn" onclick="publishPost()">🚀 포스트 발행</button>
                <div class="status-message" id="statusMessage"></div>
            </div>
            <div class="card">
                <h2>📚 최근 포스트</h2>
                <div class="post-list" id="postList">
                    <p style="color: #7f8c8d;">로딩 중...</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Quill JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <!-- 삭제 확인 모달 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>⚠️ 포스트 삭제</h3>
            <p id="deleteMessage">정말로 이 포스트를 삭제하시겠습니까?</p>
            <div class="modal-actions">
                <button class="btn-confirm" onclick="confirmDelete()">삭제</button>
                <button class="btn-cancel" onclick="closeDeleteModal()">취소</button>
            </div>
        </div>
    </div>
    
    <script>
        // GitHub 설정
        const CONFIG = {
            owner: 'honmono2021',
            repo: 'eyekine',
            password: '9122'
        };
        let quill;
        let currentDeleteIndex = null;
        // GitHub Base64 디코딩 (UTF-8 한글 지원 + 줄바꿈 처리)
        function decodeGitHubBase64(base64Str) {
            const cleaned = base64Str.replace(/\s/g, '');
            const binaryStr = atob(cleaned);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }
        function getGitHubToken() {
            const input = document.getElementById('githubToken');
            return (input?.value || localStorage.getItem('eyekine_github_token') || '').trim();
        }
        function getGitHubAuthHeaders(json = false) {
            const token = getGitHubToken();
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json'
            };
            if (json) headers['Content-Type'] = 'application/json';
            return headers;
        }
        function encodeGitHubPath(path) {
            return path.split('/').map(encodeURIComponent).join('/');
        }
        async function parseGitHubError(response) {
            let details = '';
            try {
                const data = await response.json();
                details = data?.message || '';
            } catch (_error) {
                details = '';
            }
            if (response.status === 401) {
                return 'GitHub 토큰이 없거나 만료되었습니다. 새 토큰으로 다시 로그인하세요.';
            }
            if (response.status === 403) {
                return '토큰 권한이 부족합니다. Repository Contents 읽기/쓰기 권한이 필요합니다.';
            }
            return `GitHub API 오류(${response.status})${details ? ': ' + details : ''}`;
        }
        // 로그인
        function login() {
            const password = document.getElementById('password').value;
            const token = document.getElementById('githubToken').value.trim();
            const message = document.getElementById('loginMessage');
            if (password === CONFIG.password) {
                if (!token) {
                    message.className = 'status-message error';
                    message.style.display = 'block';
                    message.textContent = '❌ GitHub 토큰을 입력해주세요';
                    return;
                }
                localStorage.setItem('eyekine_github_token', token);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('editorScreen').style.display = 'block';
                initializeEditor();
                loadPosts();
            } else {
                message.className = 'status-message error';
                message.style.display = 'block';
                message.textContent = '❌ 비밀번호가 올바르지 않습니다';
            }
        }
        // Enter 키로 로그인
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });
            const savedToken = localStorage.getItem('eyekine_github_token');
            if (savedToken) {
                document.getElementById('githubToken').value = savedToken;
            }
        });
        // Quill 에디터 초기화
        function initializeEditor() {
            const toolbarOptions = [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image'],
                ['clean']
            ];
            quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: {
                        container: toolbarOptions,
                        handlers: {
                            image: imageHandler
                        }
                    }
                },
                placeholder: '여기에 내용을 작성하세요...'
            });
        }
        // 이미지 핸들러
        function imageHandler() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();
            input.onchange = async () => {
                const file = input.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const range = quill.getSelection(true);
                        const index = range ? range.index : quill.getLength();
                        quill.insertEmbed(index, 'image', e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };
        }
        // 포스트 발행
        async function publishPost() {
            const title = document.getElementById('title').value;
            const content = quill.root.innerHTML;
            const btn = document.getElementById('publishBtn');
            if (!title || quill.getText().trim().length === 0) {
                showMessage('error', '❌ 제목과 내용을 모두 입력해주세요');
                return;
            }
            btn.disabled = true;
            btn.textContent = '발행 중...';
            showMessage('info', '⏳ 포스트를 발행하고 있습니다...');
            try {
                const slug = title
                    .toLowerCase()
                    .replace(/[^a-z0-9가-힣]/g, '-')
                    .replace(/-+/g, '-')
                    .replace(/^-|-$/g, '');
                
                const timestamp = Date.now();
                const folderName = `blog/${slug}-${timestamp}`;
                // 이미지 처리
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                const images = tempDiv.querySelectorAll('img');
                
                let processedContent = content;
                let imageIndex = 0;
                for (const img of images) {
                    const src = img.src;
                    if (src.startsWith('data:image')) {
                        imageIndex++;
                        const base64Data = src.split(',')[1];
                        const imgPath = `${folderName}/images/image-${imageIndex}.jpg`;
                        
                        await uploadToGitHub(imgPath, base64Data);
                        processedContent = processedContent.replace(src, `images/image-${imageIndex}.jpg`);
                    }
                }
                // HTML 파일 생성
                const html = generateHTML(title, processedContent);
                const htmlPath = `${folderName}/index.html`;
                await uploadToGitHub(htmlPath, btoa(unescape(encodeURIComponent(html))));
                // 미리보기 텍스트 추출
                const tempDiv2 = document.createElement('div');
                tempDiv2.innerHTML = processedContent;
                let excerpt = tempDiv2.textContent.trim();
                excerpt = excerpt.replace(/\s+/g, ' ').substring(0, 150);
                if (tempDiv2.textContent.length > 150) excerpt += '...';
                // posts.json 업데이트
                await updatePostsJSON({
                    title: title,
                    path: folderName,
                    date: new Date().toISOString(),
                    timestamp: timestamp,
                    excerpt: excerpt
                });
                showMessage('success', `✅ 포스트가 발행되었습니다!\n\nURL: https://eyekine.com/${folderName}/`);
                
                setTimeout(() => {
                    document.getElementById('title').value = '';
                    quill.setContents([]);
                    loadPosts();
                }, 2000);
            } catch (error) {
                showMessage('error', '❌ 발행 실패: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 포스트 발행';
            }
        }
        // GitHub 업로드
        async function uploadToGitHub(path, content) {
            const encodedPath = encodeGitHubPath(path);
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodedPath}`;
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: getGitHubAuthHeaders(true),
                body: JSON.stringify({
                    message: `Add ${path}`,
                    content: content,
                    branch: 'main'
                })
            });
            if (!response.ok) throw new Error(await parseGitHubError(response));
            return await response.json();
        }
        // posts.json 업데이트
        async function updatePostsJSON(newPost) {
            try {
                // 기존 posts.json 가져오기
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/posts.json`,
                    {
                        headers: getGitHubAuthHeaders()
                    }
                );
                let posts = [];
                let sha = null;
                if (response.ok) {
                    const data = await response.json();
                    sha = data.sha;
                    const content = decodeGitHubBase64(data.content);
                    posts = JSON.parse(content);
                }
                // 새 포스트 추가
                posts.unshift(newPost);
                // posts.json 업데이트
                const updateResponse = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/posts.json`,
                    {
                        method: 'PUT',
                        headers: getGitHubAuthHeaders(true),
                        body: JSON.stringify({
                            message: 'Update posts.json',
                            content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
                            sha: sha,
                            branch: 'main'
                        })
                    }
                );
                if (!updateResponse.ok) throw new Error(await parseGitHubError(updateResponse));
            } catch (error) {
                console.error('Error updating posts.json:', error);
                throw error;
            }
        }
        // HTML 생성 (사이트 디자인과 일치하는 템플릿)
        function generateHTML(title, content) {
            const dateStr = new Date().toLocaleDateString('ko-KR', {
                year: 'numeric', month: '2-digit', day: '2-digit'
            }).replace(/\\. /g, '.').replace(/\\.$/, '');
            return `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} - EYEKINE</title>
    <meta name="description" content="${title}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>

            --color-bg: #fdfcfa;
            --color-text: #1a1614;
            --color-text-light: #6b6660;
            --color-accent: #8b7355;
            --color-accent-light: #c4b5a0;
            --color-border: #e8e3dc;
            --color-card: #ffffff;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Noto Sans KR', -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.9;
        }
        header {
            border-bottom: 1px solid var(--color-border);
            background-color: rgba(253, 252, 250, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }
        .logo-main {
            font-family: var(--font-sans);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--color-text);
        }
        .logo-sub {

        }
        nav a:hover { color: var(--color-accent); }

        }

        }
        .article-category {

        }
        .article-header h1 {
            font-family: var(--font-serif);

        .article-content {
            font-size: 1.05rem;

        }
        .article-content h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 500;
            margin: 3rem 0 1.5rem 0;
        }
        .article-content h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 2.5rem 0 1rem 0;
        }
        .article-content p { margin-bottom: 1.5rem; }
        .article-content strong {
            color: var(--color-accent);
            font-weight: 600;
        }
        .article-content em {
            color: var(--color-accent);
            font-style: normal;
        }
        .article-content ul, .article-content ol {
            margin: 1.5rem 0 1.5rem 2rem;
        }
        .article-content li { margin-bottom: 0.8rem; }
        .article-content blockquote {

        }
        // 메시지 표시
        function showMessage(type, text) {
            const message = document.getElementById('statusMessage');
            message.className = `status-message ${type}`;
            message.textContent = text;
            message.style.display = 'block';
        }
        // 포스트 목록 로드
        async function loadPosts() {
            const postList = document.getElementById('postList');
            
            try {
                const response = await fetch('https://eyekine.com/posts.json?' + Date.now());
                
                if (response.ok) {
                    const posts = await response.json();
                    
                    if (posts.length === 0) {
                        postList.innerHTML = '<p style="color: #7f8c8d;">아직 포스트가 없습니다</p>';
                        return;
                    }
                    postList.innerHTML = posts.map((post, index) => {
                        const date = new Date(post.date).toLocaleDateString('ko-KR');
                        const safeTitle = JSON.stringify(post.title).replace(/"/g, '&quot;');
                        return `
                            <div class="post-item">
                                <div class="info">
                                    <div class="title">${post.title}</div>
                                    <div class="date">${date}</div>
                                </div>
                                <button class="btn-delete" onclick="deletePost(${index}, ${safeTitle})">🗑️ 삭제</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    postList.innerHTML = '<p style="color: #7f8c8d;">포스트 목록이 없습니다</p>';
                }
            } catch (error) {
                console.error('Load error:', error);
                postList.innerHTML = '<p style="color: #7f8c8d;">포스트 목록을 불러오는 중...</p>';
            }
        }
        // 포스트 삭제
        function deletePost(index, title) {
            currentDeleteIndex = index;
            document.getElementById('deleteMessage').textContent = 
                `"${title}" 포스트를 삭제하시겠습니까?\n(복구할 수 없습니다)`;
            document.getElementById('deleteModal').classList.add('active');
        }
        // 삭제 확인
        async function confirmDelete() {
            if (currentDeleteIndex === null) return;
            closeDeleteModal();
            showMessage('info', '⏳ 삭제 중...');
            try {
                // posts.json 가져오기
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/posts.json`,
                    {
                        headers: getGitHubAuthHeaders()
                    }
                );
                if (!response.ok) {
                    throw new Error(await parseGitHubError(response));
                }
                const data = await response.json();
                const posts = JSON.parse(decodeGitHubBase64(data.content));
                const deletedPost = posts[currentDeleteIndex];
                // 포스트 폴더 삭제
                await deleteFolderRecursive(deletedPost.path);
                // posts.json에서 제거
                posts.splice(currentDeleteIndex, 1);
                // posts.json 업데이트
                await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/posts.json`,
                    {
                        method: 'PUT',
                        headers: getGitHubAuthHeaders(true),
                        body: JSON.stringify({
                            message: 'Delete post from posts.json',
                            content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2)))),
                            sha: data.sha,
                            branch: 'main'
                        })
                    }
                );
                showMessage('success', '✅ 포스트가 삭제되었습니다');
                setTimeout(() => loadPosts(), 1000);
            } catch (error) {
                console.error('Delete error:', error);
                showMessage('error', '❌ 삭제 실패: ' + error.message);
            }
            currentDeleteIndex = null;
        }
        // 폴더 재귀 삭제
        async function deleteFolderRecursive(path) {
            try {
                const encodedPath = encodeGitHubPath(path);
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodedPath}`,
                    {
                        headers: getGitHubAuthHeaders()
                    }
                );
                if (!response.ok) return; // 폴더 없으면 무시
                const contents = await response.json();
                
                if (Array.isArray(contents)) {
                    for (const item of contents) {
                        if (item.type === 'file') {
                            await deleteFile(item.path, item.sha);
                        } else if (item.type === 'dir') {
                            await deleteFolderRecursive(item.path);
                        }
                    }
                }
            } catch (error) {
                console.error(`Error deleting ${path}:`, error);
            }
        }
        // 파일 삭제
        async function deleteFile(path, sha) {
            try {
                const encodedPath = encodeGitHubPath(path);
                await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodedPath}`,
                    {
                        method: 'DELETE',
                        headers: getGitHubAuthHeaders(true),
                        body: JSON.stringify({
                            message: `Delete ${path}`,
                            sha: sha,
                            branch: 'main'
                        })
                    }
                );
            } catch (error) {
                console.error(`Error deleting file ${path}:`, error);
            }
        }
        // 삭제 모달 닫기
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            currentDeleteIndex = null;
        }
        // 모달 배경 클릭시 닫기
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('deleteModal');
            if (e.target === modal) {
                closeDeleteModal();
            }
        });
    </script>
</body>
